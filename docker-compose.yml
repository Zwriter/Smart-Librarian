services:

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      ANONYMIZED_TELEMETRY: "false"
      CHROMA_PRODUCT_TELEMETRY_IMPL: app.core.noop_chroma_telemetry.NoOpTelemetry
      BOOK_DATA_PATH: /app/data/book_summaries.json
      CHROMA_PERSIST_DIRECTORY: /app/.chroma
      FILTER_CONFIG_PATH: /app/data/filter_config.json
      LOG_FILE_PATH: /app/logs/app.log
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173","http://localhost:8080","http://127.0.0.1:8080"]'
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/app/.chroma
      - backend-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  chroma-data:
  backend-logs:
