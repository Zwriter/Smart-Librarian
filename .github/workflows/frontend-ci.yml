name: Frontend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Oxlint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build
